# Code quality gate: katrā push / pull request GitHub nokompilē programmu
# un izpilda visus testus (scala-cli run . -- --test).
# Ja kāds tests neizdodas, programma beidzas ar kodu 1 un pārbaude ir sarkana.
name: Scala quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: coursier/cache-action@v6

      - name: Install Scala CLI
        uses: VirtusLab/scala-cli-setup@main

      - name: Compile
        run: scala-cli compile .

      - name: Run all tests
        run: scala-cli run . -- --test
